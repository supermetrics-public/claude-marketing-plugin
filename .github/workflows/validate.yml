name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @anthropic-ai/claude-code@2.1.286
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict ./plugins/supermetrics-marketing
      - name: Check for stray files
        run: |
          if find . -name .DS_Store -not -path './.git/*' | grep -q .; then echo "Remove .DS_Store files"; exit 1; fi
